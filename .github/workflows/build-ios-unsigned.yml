name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка, тег или коммит"
        default: "main"
      scheme:
        description: "Схема Xcode (пусто = автоопределение)"
        default: ""

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check Xcode >= 26.6 and get Metal Toolchain
        run: |
          xcodebuild -version
          ver=$(xcodebuild -version | head -1 | awk '{print $2}')
          if [ "$(printf '%s\n' 26.6 "$ver" | sort -V | head -1)" != "26.6" ]; then
            echo "::error::Нужен Xcode 26.6+, на раннере $ver"; exit 1
          fi
          xcodebuild -downloadComponent MetalToolchain

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Read Ruby version from Gemfile
        run: |
          RUBY_VER=$(grep -E "^ruby ['\"]" Gemfile | sed -E "s/^ruby ['\"]([0-9.]+).*/\1/")
          echo "Ruby из Gemfile: $RUBY_VER"
          echo "RUBY_VER=$RUBY_VER" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VER }}
          bundler-cache: true

      - name: Install JS deps
        run: |
          corepack enable
          [ -f .env ] || cp .env.example .env
          yarn install --frozen-lockfile

      - name: Generate Env.xcconfig and Firebase stub
        run: |
          # 1. Env.xcconfig из .env (в xcconfig "//" — комментарий, экранируем)
          mkdir -p ios/Config
          if [ ! -f ios/Config/Env.xcconfig ]; then
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env \
              | sed 's#//#/$()/#g' > ios/Config/Env.xcconfig || true
            touch ios/Config/Env.xcconfig
          fi
          echo "--- Env.xcconfig (только ключи) ---"
          cut -d= -f1 ios/Config/Env.xcconfig

          # 2. Где проект ищет GoogleService-Info.plist
          echo "--- Ссылки на GoogleService-Info.plist в проекте ---"
          grep -n "GoogleService-Info.plist" ios/PocketPal.xcodeproj/project.pbxproj || echo "нет ссылок"

          # 3. Заглушка Firebase (только если настоящего файла нет)
          for p in ios/GoogleService-Info.plist ios/PocketPal/GoogleService-Info.plist; do
            [ -f "$p" ] && continue
            mkdir -p "$(dirname "$p")"
            cat > "$p" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>API_KEY</key><string>AIzaSyA00000000000000000000000000000000</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>BUNDLE_ID</key><string>com.pocketpalai</string>
            <key>PROJECT_ID</key><string>local-build</string>
            <key>STORAGE_BUCKET</key><string>local-build.appspot.com</string>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_GCM_ENABLED</key><false/>
            <key>IS_SIGNIN_ENABLED</key><false/>
          </dict></plist>
          EOF
            sed -i '' 's/^          //' "$p"
            echo "Создана заглушка: $p"
          done

      - name: Install Pods
        run: cd ios && bundle exec pod install

      - name: Point Xcode at Node (+ memory limits for Metro)
        run: |
          cat > ios/.xcode.env.local <<EOF
          export NODE_BINARY=$(command -v node)
          export NODE_OPTIONS=--max-old-space-size=3584
          export EXTRA_PACKAGER_ARGS="--max-workers 2"
          EOF
          sed -i '' 's/^ *//' ios/.xcode.env.local
          cat ios/.xcode.env.local

      - name: Test JS bundle (diagnostic)
        env:
          NODE_OPTIONS: --max-old-space-size=3584
        run: |
          set -o pipefail
          npx react-native bundle --platform ios --dev false \
            --entry-file index.js \
            --bundle-output /tmp/main.jsbundle \
            --assets-dest /tmp/rn-assets \
            --max-workers 2 2>&1 | tail -n 100

      - name: Detect workspace and scheme
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME="${{ inputs.scheme }}"
          [ -z "$SCHEME" ] && SCHEME=$(basename "$WS" .xcworkspace)
          echo "WS=$WS" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild -list -workspace "$WS"

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild -workspace "$WS" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          mkdir -p out/Payload && cp -R "$APP" out/Payload/
          (cd out && zip -qry ../PocketPal-unsigned.ipa Payload)
          shasum -a 256 PocketPal-unsigned.ipa | tee PocketPal-unsigned.ipa.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PocketPal-unsigned
          path: |
            PocketPal-unsigned.ipa
            PocketPal-unsigned.ipa.sha256

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: xcodebuild.log
